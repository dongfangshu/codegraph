# Fork-side release: builds a self-contained Windows bundle (vendored Node +
# the app, incl. the xlua bridge) and publishes it as a GitHub Release that
# install.ps1 downloads. Everything here runs on the fork's own Actions — no
# kernel matrix, no npm publishing (thin-installer publishing needs npm OIDC
# trusted publishing wired to this repo; the fork distributes via Releases only).
#
# Trigger: manual dispatch, or a `v*` tag push. install.ps1's latest-release
# resolution picks the newest asset either way.
name: Release xlua bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # build-bundle.sh packages official Node + dist + prod deps; no native
      # kernel exists on the fork, so it runs the wasm extraction path — fine.
      - name: Build win32-x64 bundle
        run: bash scripts/build-bundle.sh win32-x64

      - name: Checksums
        working-directory: release
        run: sha256sum codegraph-* > SHA256SUMS && ls -lh

      - name: Create / refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="fork-bundle-$(date +%Y%m%d-%H%M%S)"
          fi
          NOTES="含 C# ↔ Lua 双向桥（CS. 链调用、LuaTable.Get 绑定、GetCSharp/types[] 方言）的 fork 构建，Windows 自带 Node 运行时，无需本机安装 Node。安装：\`irm https://raw.githubusercontent.com/dongfangshu/codegraph/main/install.ps1 | iex\`"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/codegraph-* release/SHA256SUMS --clobber
          else
            gh release create "$TAG" release/codegraph-* release/SHA256SUMS \
              --title "CodeGraph（xlua 桥接版）$TAG" \
              --notes "$NOTES"
          fi